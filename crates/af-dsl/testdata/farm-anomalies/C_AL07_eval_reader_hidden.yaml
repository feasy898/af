version: 1
meta:
  name: farm_g
  graph_version: '1'
  entry: W
  input: T_in
  output:
    ref: T_out
    from: W
types:
- name: T_in
  schema:
    type: object
    properties:
      q:
        type: string
      tags:
        type: array
        items:
          type: string
- name: T_out
  schema:
    type: object
    properties:
      r:
        type: string
stores:
- name: secret
  type: kv
  writer: W
  lifecycle: run
  retention:
    max_items: 16
  eval_input: true
nodes:
- id: W
  kind: task
  uses:
    model: m@1
  writes:
  - secret
  emits:
    fin: T_out
  context:
    sections:
    - from: input
      fields:
      - q
      quota_tokens: 100
- id: c
  kind: task
  loop:
    body:
      nodes:
      - id: r
        kind: task
        context:
          sections:
          - from: store
            store: secret
            policy: full
            quota_tokens: 200
      edges: []
    max_iterations: 1
    safety_points:
    - node: r
      kind: human
- id: c.r
  kind: task
  human:
    station: st1
    role: reviewer
    resume:
      schema:
        type: object
        properties:
          approved:
            type: boolean
edges: []
policies: {}
