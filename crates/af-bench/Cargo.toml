[package]
name = "af-bench"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "bench 任务的薄兼容壳：CLI/参数面/行契约不变，执行逻辑沉入 af-execline（P6 薄壳化）"

[dependencies]
# P6 薄壳化（ADR-002:18 / 吸收方案 §1.2）：af-bench → af-execline 薄壳调库，
# 方向禁反转（af-execline 永不依赖 af-bench；workspace 无 crate 依赖 af-bench，
# 方案 §1.2-3 实测）。swe-v/terminal-bench 单题执行体、宿主桥、判分定位、
# profile 表、结果行装配、D-20 attempt 递增全部来自 af-execline。
af-execline = { path = "../af-execline" }
# injec 线留壳内（吸收方案 §1.1：本期不搬）——以下依赖为 injec 执行面所需。
af-credential = { path = "../af-credential" }
af-harness = { path = "../af-harness" }
af-meter = { path = "../af-meter" }
af-stop = { path = "../af-stop" }
af-workorder = { path = "../af-workorder" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
