[package]
name = "af-bench"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "bench 任务经自研 harness 的运行器：任务转换 → Run → 判分 → results.jsonl"

[dependencies]
af-credential = { path = "../af-credential" }
af-harness = { path = "../af-harness" }
af-meter = { path = "../af-meter" }
af-stop = { path = "../af-stop" }
af-workorder = { path = "../af-workorder" }
serde = { workspace = true }
serde_json = { workspace = true }
