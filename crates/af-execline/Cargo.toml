[package]
name = "af-execline"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "统一执行面 PoC：订单生命周期驱动（af-engine 门控 + 订单 ledger + MES 事件）"

# af-workorder：订单模型与门控错误类型（本 crate 不重定义）。
# af-engine 只以子进程方式调用（9-op 单行 JSON 协议），不作为库依赖——真引擎不打桩。
# af-mes：只用 MesEvent 类型 + 自有文件 stub writer，不连 ClickHouse（ADR-004 过渡态）。
# af-harness：P1（af-bench 吸收）——profile 表与 suite::status_label 直接使用其公开
# 类型（EndpointSpec/Protocol/AuthStyle/ReasoningTier/RunStatus）。原计划此依赖 P4 落位，
# 因上述纯函数签名绑定 af-harness 类型而提前（偏差见 RESULT-P1.md）；不改依赖方向
# （af-execline ← af-harness，无环：af-harness 不依赖 af-execline）。
# sha2：P3（判分单元与证据链）——suite::swev::sha256_hex（eval.log 指纹，D-20 项 2）
# 与 judge.rs 指纹门共用；p1_comparison 经 #[path] 编译 af-bench 原文件亦依赖它
# （随 P1 先入 dev-deps，P3 升主依赖）。钉锁树内现值（af-bench/af-effect-gateway
# 同款），不升不降。
# P4（SwevExecuteUnit，方案 §5-P4）：af-credential/af-meter/af-stop 补齐 af-bench
# 依赖集（方案 §1.2-3：af-harness 已依赖三者，加列无环；workspace 内无 crate
# 依赖 af-execline，方向 af-execline ← 各 crate 单向）——
#   af-credential：HarnessRunner issue_root（根凭证，main.rs:681-686）；
#   af-meter：BudgetLedger（Launch.budget 的 Cents 账本，main.rs:789-793）；
#   af-stop：StopPolicy（Launch.stop_policy，main.rs:796）。
[dependencies]
af-credential = { path = "../af-credential" }
af-harness = { path = "../af-harness" }
af-meter = { path = "../af-meter" }
af-mes = { path = "../af-mes" }
af-stop = { path = "../af-stop" }
af-workorder = { path = "../af-workorder" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "=0.10.9"
thiserror = { workspace = true }

[dev-dependencies]
# 集成测试构造 WorkOrder 快照与断言门控错误。版本随 workspace，不另引。
af-mes = { path = "../af-mes" }
af-workorder = { path = "../af-workorder" }
# P1：status_label 六态测试构造 RunStatus::Stopped 需要 af-stop::Decision。
af-stop = { path = "../af-stop" }

[lints]
workspace = true
