# AFB 草稿 · MetaGPT（Hong et al. 2023，软件公司 SOP 多角色流水线）
# 依据：计划/研究组/对齐机制卡/MetaGPT.md 卡⑥(a)/(b)；
#      计划/研究组/DSL-语法提案-B.md §1（七段+六构造）、§2、§4 样例 2；
#      计划/研究组/DSL-语法择优-裁决-20261024.md §二（meta.topology_selector 编译期语义、
#      escape.kind 七类词表）。
# 诚实边界：卡⑥(b) 的 9 项机制（运行时改写 SOP 图 / _watch 订阅触发 / 运行时决定收件人 /
#      代码执行副作用 / 错误文本回灌 / LLM 语义终止 / 双层上下文可见性 / 用户通道挂起恢复 /
#      角色循环内嵌重试策略）全部以 escape 逃逸舱 + 七类词表记账，不编造语法。
# 已知语法空缺（详见 MetaGPT.notes.md）：节点优先级顺序字段缺失（用静态边序近似）；
#      逃逸舱词表无「人工介入/交互挂起」类（user_channel 借用 env_adapter 记账并标注）。

version: 1

meta:
  name: metagpt_sop_pipeline
  graph_version: "1.0"
  entry: pm
  input: requirement_input
  output: { ref: signal, from: terminate }   # 终态产物 = TaskFinished 声明式终态信号（内建 signal 端口类型）
  intent: "MetaGPT 软件公司 SOP：PM→架构师→任务派发→工程师改-跑-验回环→QA 判定→TaskFinished；结构化工件 typed 交接 + envelope 血缘；运行时总线/动态收件人/代码执行等 9 项走 escape 逃逸舱"
  topology_selector:                     # 裁决 §二-1：编译期解析，只决定采用哪个预声明 SOP 候选图
    rules:
      - { when: "input.sop_variant == 'full'", use: "pkg.sweng.sop_full@1.0" }
      - { when: "input.sop_variant == 'no_qa'", use: "pkg.sweng.sop_no_qa@1.0" }
    fallback: "pkg.sweng.sop_minimal@1.0"

types:
  - name: requirement_input
    schema:
      type: object
      required: [requirement]
      properties:
        requirement: { type: string }
        sop_variant: { type: string }      # 配置项：选择预声明的 SOP 候选图（编译期）；运行时推导走 escape
  - name: prd                             # 结构化工件：PRD（schema 即接口契约）
    schema:
      type: object
      required: [product_name, vision, features]
      properties:
        product_name: { type: string }
        vision: { type: string }
        features: { type: array, items: { type: string } }
  - name: design                          # 结构化工件：设计文档
    schema:
      type: object
      required: [modules, interfaces, file_list]
      properties:
        modules: { type: array, items: { type: string } }
        interfaces: { type: array, items: { type: string } }
        file_list: { type: array, items: { type: string } }
  - name: task_item                       # 结构化工件：任务列表条目
    schema:
      type: object
      required: [id, instruction, target]
      properties:
        id: { type: string }
        instruction: { type: string }
        target: { type: string }
        depends_on: { type: array, items: { type: string } }
  - name: code_file                       # 结构化工件：代码文件
    schema:
      type: object
      required: [path, content_ref]
      properties:
        path: { type: string }
        content_ref: { type: string }
  - name: test_case                       # 结构化工件：测试用例（QA 产出）
    schema:
      type: object
      required: [name, target, assertion]
      properties:
        name: { type: string }
        target: { type: string }
        assertion: { type: string }
  - name: qa_report                       # QA 结论：类型化「通过/失败 + 失败清单」
    schema:
      type: object
      required: [pass, failures]
      properties:
        pass: { type: boolean }
        failures: { type: array, items: { type: string } }
  - name: exec_report                     # RunCode 执行结果（stderr 为自由文本）
    schema:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        stdout: { type: string }
        stderr: { type: string }
  - name: failure_item                    # 解析后的结构化失败项（回灌 prompt 用）
    schema:
      type: object
      required: [kind, message]
      properties:
        kind: { type: string }
        message: { type: string }
  - name: retry_ticket                    # 角色循环内重试票据
    schema:
      type: object
      required: [attempt]
      properties:
        attempt: { type: integer }
        note: { type: string }
  - name: sop_plan                        # 运行时推导出的 SOP 计划（escape 产物）
    schema:
      type: object
      required: [steps]
      properties:
        steps: { type: array, items: { type: string } }
        graph_ref: { type: string }
  - name: wake_ticket                     # _watch 订阅命中结果
    schema:
      type: object
      required: [matched]
      properties:
        matched: { type: boolean }
        subscriber: { type: string }
  - name: dispatch_ticket                 # 运行时收件人决议（定向/广播/all_agents）
    schema:
      type: object
      required: [mode, recipients]
      properties:
        mode: { type: string }
        recipients: { type: array, items: { type: string } }
  - name: inbox_view                      # 角色可见视图（私有收件箱 + 全局池按 cause_by 链过滤后装配）
    schema:
      type: object
      required: [artifact_excerpt, related_messages]
      properties:
        artifact_excerpt: { type: string }
        related_messages: { type: array, items: { type: string } }
  - name: verdict                         # LLM 语义判定结论
    schema:
      type: object
      required: [pass, needs_human]
      properties:
        pass: { type: boolean }
        needs_human: { type: boolean }
        reason: { type: string }
  - name: user_reply                      # 用户通道恢复值
    schema:
      type: object
      required: [answer]
      properties:
        answer: { type: string }

stores:
  - name: tasks_board                     # 任务板：ProjectManager 派发的任务清单
    type: collection
    item: task_item
    writer: planner
    lifecycle: run
    retention: { max_items: 128 }
  - name: repo                            # 工作区文件系统（跨角色共享的代码/文档产物）
    type: collection
    item: code_file
    writer: build.apply                   # 点号路径：经 loop 体逐层解析
    lifecycle: run
    retention: { max_items: 256 }
  - name: pm_memory                       # 角色私有记忆：角色自己的收件箱历史
    type: message_log
    writer: pm
    lifecycle: run
    retention: { max_items: 64 }
  - name: architect_memory
    type: message_log
    writer: architect
    lifecycle: run
    retention: { max_items: 64 }
  - name: planner_memory
    type: message_log
    writer: planner
    lifecycle: run
    retention: { max_items: 64 }
  - name: engineer_memory
    type: message_log
    writer: build.engineer
    lifecycle: run
    retention: { max_items: 64 }
  - name: qa_memory
    type: message_log
    writer: build.qa
    lifecycle: run
    retention: { max_items: 64 }

nodes:
  # ---- PM：读需求 → 产出 PRD（模板化、schema 约束的结构化生成） ----
  - id: pm
    kind: task
    uses: { model: route.main@1 }
    writes: [pm_memory]
    emits: { prd: "envelope<prd>" }        # 端口类型即信封：cause_by 血缘（from_node/artifact_type/step）
    context:
      sections:
        - { from: template, template_ref: pkg.sweng.pm_system, quota_tokens: 500 }
        - { from: input, fields: [requirement], policy: project, quota_tokens: 600 }
        - { from: store, store: pm_memory, policy: latest_k, args: { k: 20 }, quota_tokens: 1200 }

  # ---- 运行时基座（escape）：订阅命中 → 收件人决议 → 可见视图装配 ----
  - id: watch_match
    kind: task
    escape:                               # 卡⑥(b)-2：_watch 订阅表 + cause_by 链决定角色是否被激活
      kind: runtime_context_mutation
      impl_ref: packages/sweng@1.0.0/hatches/watch_match.py
      reason: "角色由『消息类型是否命中 _watch 订阅表』决定是否响应，而非静态边唤醒；激活语义在运行时求值（静态边只是其编译期近似）"
      owner: lang-team
      share_budget_pct: 15
    consumes: { prd: "envelope<prd>" }
    emits: { wake: wake_ticket }

  - id: pick_recipients
    kind: task
    escape:                               # 卡⑥(b)-3：运行时决定消息收件人（定向 send_to / 广播 / all_agents）
      kind: meta_loop
      impl_ref: packages/sweng@1.0.0/hatches/pick_recipients.py
      reason: "收件人集合在运行时才确定（边在运行时才产生），等价于运行时改图；静态边只能近似其存在性，不能近似其目标集合"
      owner: lang-team
      share_budget_pct: 10
    consumes: { wake: wake_ticket }
    emits: { dispatch: dispatch_ticket }

  - id: scope_inbox
    kind: task
    escape:                               # 卡⑥(b)-7：双层上下文可见性（角色私有记忆 + 环境全局池）
      kind: runtime_context_mutation
      impl_ref: packages/sweng@1.0.0/hatches/scope_inbox.py
      reason: "角色只应看到自己收件箱中与当前触发消息有因果链（cause_by）相关的历史：作用域化上下文装配在运行时完成，核心的 context.sections 只能表达来源与配额，不能表达因果链过滤"
      owner: lang-team
      share_budget_pct: 15
    consumes: { dispatch: dispatch_ticket, prd: "envelope<prd>" }
    emits: { inbox: inbox_view }

  # ---- 运行时 SOP 改写（escape） ----
  - id: sop_rewrite
    kind: task
    escape:                               # 卡⑥(b)-1：SOP 拓扑并非只写一次（required_previous 可改流程）
      kind: meta_loop
      impl_ref: packages/sweng@1.0.0/hatches/sop_rewrite.py
      reason: "由 Action 的 required_previous 元数据在运行时推导/改写 SOP 图：静态拓扑声明无法保真，需运行时图重写逃逸舱（编译期 topology_selector 只覆盖预声明候选图）"
      owner: lang-team
      share_budget_pct: 15
    consumes: { prd: "envelope<prd>" }
    emits: { sop: sop_plan }

  # ---- 架构师：读 PRD → 产出设计文档 ----
  - id: architect
    kind: task
    uses: { model: route.main@1 }
    writes: [architect_memory]
    consumes: { prd: "envelope<prd>", inbox: inbox_view }
    emits: { design: "envelope<design>" }
    context:
      sections:
        - { from: template, template_ref: pkg.sweng.architect_system, quota_tokens: 500 }
        - { from: edge, port: prd, fields: [vision, features], policy: project, quota_tokens: 2000 }
        - { from: edge, port: inbox, policy: project, quota_tokens: 1500 }
        - { from: store, store: architect_memory, policy: latest_k, args: { k: 20 }, quota_tokens: 1000 }

  # ---- 项目经理：由 PRD/设计派生任务列表并落任务板 ----
  - id: planner
    kind: task
    uses: { model: route.cheap@1 }
    writes: [planner_memory, tasks_board]
    consumes: { prd: "envelope<prd>", design: "envelope<design>", sop: sop_plan }
    emits: { tasks: "list<task_item>" }
    context:
      sections:
        - { from: template, template_ref: pkg.sweng.planner_system, quota_tokens: 400 }
        - { from: edge, port: prd, fields: [vision, features], policy: project, quota_tokens: 1200 }
        - { from: edge, port: design, fields: [modules, interfaces], policy: project, quota_tokens: 1500 }
        - { from: edge, port: sop, fields: [steps], policy: project, quota_tokens: 600 }
        - { from: store, store: planner_memory, policy: latest_k, args: { k: 20 }, quota_tokens: 800 }

  # ---- 工程师/QA 回环：受控循环（改 → 跑 → 验 → 打回） ----
  - id: build
    kind: task
    consumes: { tasks: "list<task_item>" }
    loop:
      body:
        nodes:
          - id: engineer
            kind: task
            uses: { model: route.main@1, tools: [pkg.sweng.locate, pkg.sweng.view, pkg.sweng.edit] }
            writes: [engineer_memory]
            consumes: { feedback: qa_report, retry: retry_ticket }
            emits: { files: "list<code_file>" }
            context:
              sections:
                - { from: template, template_ref: pkg.sweng.engineer_system, quota_tokens: 600 }
                - { from: store, store: tasks_board, policy: full, quota_tokens: 1800 }
                - { from: edge, port: feedback, fields: [failures], policy: project, quota_tokens: 800, optional: true }
                - { from: edge, port: retry, policy: project, quota_tokens: 400, optional: true }
                - { from: store, store: engineer_memory, policy: latest_k, args: { k: 20 }, quota_tokens: 1200 }
          - id: run_code
            kind: task
            escape:                         # 卡⑥(b)-4：RunCode 真实执行代码、写工作区文件（副作用）
              kind: env_adapter
              impl_ref: packages/sweng@1.0.0/hatches/run_code.py
              reason: "执行生成的代码与测试并捕获 stdout/stderr 是有状态环境契约：核心只允许调用包内注册的动作面；任意代码执行与副作用经逃逸并版本化登记"
              owner: lang-team
              share_budget_pct: 25
            consumes: { files: "list<code_file>" }
            emits: { exec: exec_report }
          - id: parse_exec_log
            kind: task
            escape:                         # 卡⑥(b)-5：stderr / 测试输出的自由文本回灌
              kind: free_text_parser
              impl_ref: packages/sweng@1.0.0/hatches/parse_exec_log.py
              reason: "执行 stderr 与测试输出的自由文本需解析为结构化失败项（kind/message）后才能回灌 prompt：自由文本双向解析不进核心"
              owner: lang-team
              share_budget_pct: 10
            consumes: { exec: exec_report }
            emits: { failures: "list<failure_item>" }
          - id: role_retry
            kind: task
            escape:                         # 卡⑥(b)-9：角色循环内嵌的异常与重试策略
              kind: runtime_context_mutation
              impl_ref: packages/sweng@1.0.0/hatches/role_retry.py
              reason: "角色 react 循环内嵌的异常捕获、重试次数上限与失败回灌时机由用户代码决定：静态 failures 预算只给兜底，不覆盖运行时策略改写"
              owner: lang-team
              share_budget_pct: 10
            consumes: { failures: "list<failure_item>" }
            emits: { retry: retry_ticket }
          - id: apply
            kind: transform
            writes: [repo]                  # 工作区落盘的唯一写者（INV-2 单写者）
            consumes: { files: "list<code_file>" }
            ops:
              - { op: merge, ports: [files], into: snapshot }
            emits: { snapshot: "list<code_file>" }
          - id: qa
            kind: check                      # 验证面；passed 端口内建
            uses: { unit: pkg.sweng.test_unit@1 }
            writes: [qa_memory]
            consumes: { snapshot: "list<code_file>" }
            emits: { report: qa_report, cases: "list<test_case>" }
            route:                           # QA 打回：不通过 → 回工程师；通过 → 退出本体
              default: exit
              rules:
                - { when: "qa.passed == false", goto: engineer }
        edges:
          - { from: engineer, output: files, to: run_code, input: files }
          - { from: run_code, output: exec, to: parse_exec_log, input: exec }
          - { from: parse_exec_log, output: failures, to: role_retry, input: failures }
          - { from: role_retry, output: retry, to: engineer, input: retry }
          - { from: engineer, output: files, to: apply, input: files }
          - { from: apply, output: snapshot, to: qa, input: snapshot }
          - { from: qa, output: report, to: engineer, input: feedback }
      max_iterations: 3
      carried:
        - { store: repo, max_items: 256 }        # 体内写、体外声明的槽必须登记（E2211）
        - { store: engineer_memory, max_items: 64 }
        - { store: qa_memory, max_items: 64 }
      safety_points:
        - { node: qa, kind: check }              # 每轮必须过外部评估（回环的安全点）
      exit_when: "attempt.passed == true"       # QA 通过 → TaskFinished 前的收束
      on_exhausted: fail
    emits: { report: { from_body: qa.report } }

  # ---- LLM 语义判定 → 终态信号 / 用户通道 ----
  - id: semantic_verdict
    kind: task
    escape:                             # 卡⑥(b)-6：LLM 判定的语义终止
      kind: llm_predicate
      impl_ref: packages/sweng@1.0.0/hatches/semantic_verdict.py
      reason: "MetaGPT 的『通过/不通过』由 QA 角色的 LLM 判断而非类型化信号：语义判定谓词只能以 llm_predicate 逃逸实现，不落 CEL"
      owner: lang-team
      share_budget_pct: 15
    consumes: { report: qa_report }
    emits: { verdict: verdict }
    route:                              # 需要人工 → 走用户通道；否则 → 发布 TaskFinished
      default: terminate
      rules:
        - { when: "semantic_verdict.verdict.needs_human == true", goto: user_channel }

  - id: terminate
    kind: task
    uses: { tool: pkg.sweng.publish_task_finished }
    consumes: { verdict: verdict }
    emits: { done: signal }              # TaskFinished：声明式终态信号

  - id: user_channel
    kind: task
    escape:                             # 卡⑥(b)-8：用户通道 / 人工介入 / 中断续跑
      kind: env_adapter
      impl_ref: packages/sweng@1.0.0/hatches/user_channel.py
      reason: "send_to_user 通道需向用户提问/回传并挂起等待恢复值，跨进程中断续跑属有状态环境契约；词表无「人工介入」类，按最接近的环境契约类记账"
      owner: lang-team
      share_budget_pct: 10
    consumes: { verdict: verdict }
    emits: { reply: user_reply }

edges:
  - { from: pm, output: prd, to: architect, input: prd }
  - { from: pm, output: prd, to: watch_match, input: prd }
  - { from: pm, output: prd, to: sop_rewrite, input: prd }
  - { from: watch_match, output: wake, to: pick_recipients, input: wake }
  - { from: pick_recipients, output: dispatch, to: scope_inbox, input: dispatch }
  - { from: scope_inbox, output: inbox, to: architect, input: inbox }
  - { from: pm, output: prd, to: planner, input: prd }
  - { from: architect, output: design, to: planner, input: design, checkpoint: true }
  - { from: sop_rewrite, output: sop, to: planner, input: sop }
  - { from: planner, output: tasks, to: build, input: tasks, checkpoint: true }
  - { from: build, output: report, to: semantic_verdict, input: report, checkpoint: true }
  - { from: semantic_verdict, output: verdict, to: terminate, input: verdict }
  - { from: semantic_verdict, output: verdict, to: user_channel, input: verdict }

policies:
  budgets:
    - { id: cost_cap, dimension: cents, scope: plan, cap: 600 }        # 论文：结构化摘要 + 小上下文 → 低成本（金额量级存疑，取工程值）
    - { id: token_cap, dimension: tokens_total, scope: plan, cap: 400000 }
    - { id: pm_turns, dimension: turns, scope: node:pm, cap: 12 }
    - { id: architect_turns, dimension: turns, scope: node:architect, cap: 12 }
    - { id: fix_turns, dimension: turns, scope: loop:build, cap: 60 }   # 改→跑→验回环的轮次上限
  stop:
    - { when: "steps.turns >= 60", outcome: failed }                    # 论文未给通用 max_round：以步数兜底
    - { when: "budget.cents_spent >= budget.cents_cap", outcome: failed }
  failures:
    - class: schema_invalid         # LLM 输出不符合 schema：角色内重试（论文称 react 内捕获异常）
      route: same_node
      feedback: format_reminder
      retry: { max: 2, backoff_ms: 0 }
    - class: tool_error             # 工具/写文件类动作失败
      route: same_node
      feedback: error_observation
    - class: environment_failure    # RunCode 执行环境失败
      retry: { max: 3, backoff_ms: 60000 }
    - class: gate_refused           # QA 打回（结构化失败清单已在循环体内回灌）
      route: next_iteration
    - class: timeout
      retry: { max: 1, backoff_ms: 0 }
    - class: budget_exhausted
      terminal: true
      outcome: failed
