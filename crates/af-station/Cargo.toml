[package]
name = "af-station"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"

[dependencies]
rusqlite = { workspace = true }
# 1.0.69。与根上的 thiserror 2.0.21 主版本不同，继承 `thiserror` 会升到 2。
thiserror = "1.0"

[lints]
workspace = true

[dev-dependencies]
# 操作序列属性测试。默认特性含 fork/timeout/bit-set；bit-set 会把 borsh derive 统一进工作区。
# 任务卡允许 proptest =1.12.0，只作 dev-dependency。
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
