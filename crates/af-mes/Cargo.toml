[package]
name = "af-mes"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "MES 事件表 schema 与 ClickHouse HTTP 批写入"

# clickhouse 钉 0.15.3：任务裁决的官方客户端，HTTP + RowBinary，默认 lz4。
# 不启 test-util：该 feature 会把默认压缩改成 None，和裁决相反。
# 不启 inserter：官方 Inserter 用真实时间切批，本 crate 的延迟阈值走注入时钟。
# serde / thiserror 走 workspace。tokio、serde_json 在写入器提交里说明版本。
[dependencies]
clickhouse = { version = "=0.15.3", default-features = false, features = ["lz4"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# 1.53.3 已在 Cargo.lock。客户端是异步的；同步 API 在 crate 内 block_on。
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }

[lints]
workspace = true
