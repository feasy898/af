[dev-dependencies]
# 属性测试（CONWIP 不超发 / 渐放单调 / 拒绝不部分提交）。
# 版本与 af-calendar、af-sampling、af-stop 对齐，精确钉 1.12.0。
# 默认特性含 fork、timeout、bit-set；bit-set 会经 bit-vec 把 borsh derive
# 特性统一进工作区，故只开 std。
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
