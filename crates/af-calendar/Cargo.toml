[package]
name = "af-calendar"
version = "0.1.0"
edition.workspace = true

# PoC 依赖:chrono + chrono-tz(时区/日历时间,题设指定);serde(日历=运营者配置,可 JSON 加载);
# thiserror(类型化错误)。不引 tokio/rusqlite——纯函数式时间计算,无 IO。
[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
