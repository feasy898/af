[package]
name = "af-credential"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"

[dependencies]
anyhow = "1"
biscuit-auth = "6"
cedar-policy = "4"
# 根密钥元数据。版本在 workspace 钉死（rusqlite 0.32.1 bundled / serde_json 1.0.154 / thiserror 2.0.21）。
rusqlite = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# 快照。yaml feature 打开 assert_yaml_snapshot!（serde_yaml）。
insta = { version = "1.49.0", features = ["yaml"] }
# 测试里的快照视图要 Serialize。版本用 workspace 已钉的 1.0.229。
serde = { workspace = true }
