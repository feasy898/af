[package]
name = "casr"
version = "0.1.0"
edition = "2021"

# 独立 workspace：防止被 AF 根 workspace 吸收（纪律要求）
[workspace]

[dependencies]
# default-features=false：裁掉 rustls/gzip（本地 http registry 用不到；rustls→ring 的 C 编译在 /tmp 配额受限环境下过不去）
ureq = { version = "3.1", default-features = false }
sha2 = "0.10"
serde_json = "1"
